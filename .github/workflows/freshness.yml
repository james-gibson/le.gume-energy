name: freshness

# The import cannot run here: the collector databases are machine-local and
# deliberately unpublished. What this can do is notice that the DATA in the
# committed export stopped advancing — not that the exporter ran, which a
# re-export over an unchanged collector database would falsely refresh.
on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # No npm ci: the check is zero-dependency and reads one committed file.
      - run: node scripts/freshness.mjs --max-age 2
